name: SwiftTesting
options:
  bundleIdPrefix: dev.xcrew.testbed
  deploymentTarget:
    iOS: "18.0"
targets:
  Kit:
    type: framework
    platform: iOS
    sources: [Kit]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  KitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KitTests]
    dependencies:
      - target: Kit
    settings:
      GENERATE_INFOPLIST_FILE: YES
  CancelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CancelTests]
    dependencies:
      - target: Kit
    settings:
      GENERATE_INFOPLIST_FILE: YES
  NestedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NestedTests]
    dependencies:
      - target: Kit
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Kit:
    build:
      targets:
        Kit: all
    test:
      targets: [KitTests]
  Cancel:
    build:
      targets:
        Kit: all
    test:
      targets: [CancelTests]
  Nested:
    build:
      targets:
        Kit: all
    test:
      targets: [NestedTests]
  KitPlans:
    build:
      targets:
        Kit: all
    test:
      testPlans:
        - path: KitPlans.xctestplan
          defaultPlan: true
